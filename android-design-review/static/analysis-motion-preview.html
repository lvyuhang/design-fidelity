<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析动效预览</title><link rel="stylesheet" href="/style.css"><style>body{overflow:auto;background:#151515;font-size:13px}header{padding:22px 28px;display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #ffffff0a}h1{font-size:17px;font-weight:550;margin:0 0 6px}header p{margin:0;color:#888;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;background:#242424;padding:8px 12px;border-radius:6px;color:#999}.actions button.active{background:#343b4d;color:#d1ddfa}.pair{display:flex;justify-content:center;align-items:flex-start;gap:16px;padding:65px 24px 25px}.pair section{min-width:0;max-width:45%}.pair h2{font-size:11px;font-weight:400;color:#888;margin:0 0 30px}.frame{position:relative;width:fit-content;max-width:100%;border-radius:4px}.frame>img{display:block;max-width:100%;height:65vh;width:auto;border-radius:4px}footer{text-align:center;color:#747474;font-size:11px;padding:8px 24px 24px}.ai-canvas-progress .ai-canvas-label{max-width:none}.pair .ai-motion-region>span{font-size:9px}#message{color:#b6c4df}</style><header><div><h1>让分析过程看得见</h1><p>动效预览 · 演示状态，不发起 AI 分析</p></div><div class="actions"><button data-step="preparing">准备</button><button data-step="comparing">比对</button><button data-step="partial">分区完成</button><button data-step="adjudicating">复核</button><button data-step="done">结束</button></div></header><main class="pair"><section><h2>蓝湖原稿</h2><div class="frame" id="motion-reference"><img alt="设计原图"><div class="ai-canvas-progress"><span class="ai-canvas-label"></span><div class="ai-motion-regions"></div></div></div></section><section><h2>设备截图</h2><div class="frame" id="motion-capture"><img alt="设备截图"><div class="ai-canvas-progress"><span class="ai-canvas-label"></span><div class="ai-motion-regions"></div></div></div></section></main><footer><span id="message"></span><p>双侧同步 · 低透明度蒙版 · 不遮挡操作 · 完成区域停止动效</p></footer><script>const aiPending=j=>['queued','running','submitting'].includes(j.status);
function aiMotionRegions(job,side){
  if(!job||!aiPending(job)||job.stage==='queued')return [];
  const selected=side==='reference'?job.reference_region:job.region;
  const rect={...(selected||{x:0,y:0,width:1,height:1}),kind:selected?'local':'area'};
  if(job.stage!=='comparing')return [{...rect,state:job.stage==='preparing'?'locating':'reviewing',label:job.stage==='preparing'?'定位可比区域':job.stage==='adjudicating'?'复核差异':'整理结果'}];
  if(job.region)return [{...rect,state:'scanning',label:'选区比对中'}];
  const done=new Set(job.completed_regions||[]);
  return [['header',0,.36,'顶部'],['content',.30,.56,'内容'],['navigation',.82,.18,'底部']].map(([id,y,height,name])=>({x:0,y,width:1,height,kind:'area',delay:-y*3,state:done.has(id)?'done':'scanning',label:name+(done.has(id)?' · 已比对':' · 比对中')}));
}
function show(step){document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',b.dataset.step===step));const job={status:step==='done'?'done':'running',stage:step==='partial'?'comparing':step,completed_regions:step==='partial'?['header','navigation']:[]};const labels={preparing:'定位可比区域',comparing:'顶部、内容与底部正在并行比对',partial:'顶部、底部已比对 · 内容仍在比对',adjudicating:'复核业务状态与样式差异',done:'分析动效结束，恢复干净画面'};document.getElementById('message').textContent=labels[step];for(const side of ['reference','capture']){const overlay=document.querySelector('#motion-'+side+' .ai-canvas-progress');overlay.hidden=step==='done';overlay.querySelector('.ai-canvas-label').textContent=labels[step];const layer=overlay.querySelector('.ai-motion-regions');layer.replaceChildren();for(const r of aiMotionRegions(job,side)){const b=document.createElement('div');b.className='ai-motion-region';b.dataset.state=r.state;b.dataset.kind=r.kind;b.style.cssText=`--scan-delay:${r.delay||0}s;left:${r.x*100}%;top:${r.y*100}%;width:${r.width*100}%;height:${r.height*100}%`;const text=document.createElement('span');text.textContent=r.label;b.append(text);layer.append(b);}}}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>show(b.dataset.step));(async()=>{const id=new URLSearchParams(location.hash.slice(1)).get('run')||'6caa9c3275d0419595c9c89dbc5a660a';const response=await fetch('/api/runs/'+encodeURIComponent(id));if(!response.ok)throw Error('截图记录无法读取');const run=await response.json();document.querySelector('#motion-reference>img').src='/files/designs/'+encodeURIComponent(run.design_id)+'/reference.png';document.querySelector('#motion-capture>img').src=run.original_url;show('comparing');})().catch(e=>document.getElementById('message').textContent=e.message);</script></html>
